<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Gate Pass ecosystem diagram showing employee kiosk, mobile monitoring and security kiosk"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142a44"/><stop offset="1" stop-color="#0a1324"/></linearGradient></defs><rect width="1200" height="560" rx="30" fill="url(#bg)"/><text x="600" y="72" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#eaf6ff" text-anchor="middle">GATE PASS MANAGEMENT ECOSYSTEM</text><text x="600" y="106" font-family="Arial,sans-serif" font-size="17" fill="#9dc5d0" text-anchor="middle">Three connected applications · One approval workflow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="55" y="170" width="315" height="255" rx="20" fill="#183450" stroke="#4b7b91" stroke-width="3"/><rect x="83" y="197" width="259" height="128" rx="10" fill="#0d1b2f" stroke="#6be2d0" stroke-width="3"/><rect x="106" y="224" width="145" height="13" rx="5" fill="#68ddc8"/><rect x="106" y="252" width="211" height="12" rx="5" fill="#426f83"/><rect x="106" y="277" width="173" height="12" rx="5" fill="#426f83"/><text x="212" y="365" fill="#f2fbff" font-size="22" font-weight="bold">Employee Kiosk</text><text x="212" y="395" fill="#b8d1df" font-size="16">Create gate pass requests</text><rect x="440" y="155" width="320" height="285" rx="20" fill="#183450" stroke="#4b7b91" stroke-width="3"/><rect x="551" y="181" width="100" height="170" rx="18" fill="#0d1b2f" stroke="#6be2d0" stroke-width="5"/><rect x="570" y="218" width="62" height="11" rx="5" fill="#68ddc8"/><rect x="570" y="244" width="62" height="11" rx="5" fill="#426f83"/><rect x="570" y="270" width="62" height="11" rx="5" fill="#426f83"/><text x="600" y="387" fill="#f2fbff" font-size="22" font-weight="bold">Admin Mobile App</text><text x="600" y="415" fill="#b8d1df" font-size="16">Monitor workflow</text><rect x="830" y="170" width="315" height="255" rx="20" fill="#183450" stroke="#4b